<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="paranco">
  <!-- A hoist: one wheel, one rope, one load. The wheel is the mechanism and
       stays the colour of paper; the rope and the load are the thing being
       moved, in amber. Three strokes, so it survives sixteen pixels. -->
  <rect width="64" height="64" rx="14" fill="#0E0D0C"/>
  <circle cx="32" cy="21" r="8" fill="none" stroke="#EDE8DE" stroke-width="5"/>
  <rect x="29.5" y="29" width="5" height="14" rx="2.5" fill="#E0A458"/>
  <rect x="19" y="43" width="26" height="6" rx="3" fill="#E0A458"/>
</svg>
